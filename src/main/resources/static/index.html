<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QueryX - AI Assistant</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <div class="brand">
            <div class="logo">Q</div>

            <div>
                <h2>Query<span>X</span></h2>
                <p>Your AI Assistant</p>
            </div>
        </div>

        <button class="new-chat" id="newChatBtn">
            + New Chat
        </button>

        <p class="section-title">Conversations</p>

        <div class="conversation-list" id="conversationList">
        </div>

        <div class="sidebar-bottom">

            <button class="sidebar-action" id="themeBtn">
                ☀ Toggle Theme
            </button>

            <button class="sidebar-action" id="clearBtn">
                🗑 Clear All Chats
            </button>

            <div class="profile">
                <div class="avatar">N</div>

                <div>
                    <strong>Nikhil</strong>
                    <p>QueryX User</p>
                </div>
            </div>

        </div>

    </aside>


    <!-- MAIN CHAT -->
    <main class="chat-area">

        <header class="chat-header">
            <div>
                <h3 id="chatTitle">New Conversation</h3>
                <p id="conversationIdText"></p>
            </div>
        </header>


        <!-- MESSAGES -->
        <section class="messages" id="messages">

            <div class="welcome" id="welcome">
                <div class="welcome-logo">Q</div>

                <h1>Welcome to QueryX</h1>

                <p>
                    Your intelligent AI assistant.
                    Ask me anything.
                </p>

                <div class="suggestions">

                    <button onclick="useSuggestion('Explain Spring AI in simple words')">
                        Explain Spring AI
                    </button>

                    <button onclick="useSuggestion('What is RAG?')">
                        What is RAG?
                    </button>

                    <button onclick="useSuggestion('Explain Java dependency injection')">
                        Java Help
                    </button>

                </div>

            </div>

        </section>


        <!-- INPUT -->
        <div class="input-wrapper">

            <div class="input-box">

                <textarea
                        id="messageInput"
                        placeholder="Type your message..."
                        rows="1"></textarea>

                <button id="sendBtn">
                    ➤
                </button>

            </div>

            <p class="input-hint">
                Enter to send · Shift + Enter for new line
            </p>

        </div>

    </main>

</div>

<script src="script.js"></script>

</body>
</html>
